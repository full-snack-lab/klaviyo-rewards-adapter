name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up Node.js
        # v6.1.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.20.0
      - name: Set up Bun
        # v2.1.3
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Find pending changesets
        id: pending
        run: |
          if find .changeset -maxdepth 1 -type f -name '*.md' \
            ! -name README.md | grep -q .; then
            echo 'release=true' >> "$GITHUB_OUTPUT"
          else
            echo 'release=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Apply changesets
        if: steps.pending.outputs.release == 'true'
        run: |
          bunx changeset version
          bun install --lockfile-only
      - name: Commit release version
        if: steps.pending.outputs.release == 'true'
        run: |
          manifest=./package.json
          package_name=$(node -p "require('$manifest').name")
          package_version=$(node -p "require('$manifest').version")
          release_tag="${package_name}@${package_version}"
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all .changeset CHANGELOG.md package.json bun.lock
          git commit -m "chore: release $release_tag"
          git push origin HEAD:main
      - name: Publish package
        id: publish
        if: steps.pending.outputs.release == 'true'
        env:
          NPM_CONFIG_USERCONFIG: /dev/null
        run: |
          manifest=./package.json
          package_name=$(node -p "require('$manifest').name")
          package_version=$(node -p "require('$manifest').version")
          release_tag="${package_name}@${package_version}"
          env -u NPM_TOKEN -u NODE_AUTH_TOKEN -u BUN_AUTH_TOKEN \
            -u NPM_CONFIG_TOKEN npm publish . \
            --registry=https://registry.npmjs.org/ \
            --access=public \
            --tag=latest \
            --provenance=false
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        if: steps.pending.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.publish.outputs.tag }}
        run: |
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "$RELEASE_TAG"
